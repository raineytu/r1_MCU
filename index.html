<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歡迎光臨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }

    .card {
      background: #ffffff;
      padding: 48px 36px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 420px;
      width: 90%;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .icon {
      font-size: 56px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 32px;
      color: #2d3748;
      margin-bottom: 12px;
      font-weight: 700;
    }

    p {
      font-size: 16px;
      color: #718096;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      background: #667eea;
      color: #ffffff;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 999px;
      transition: background 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn:hover {
      background: #5a67d8;
      box-shadow: 0 6px 18px rgba(102, 126, 234, 0.6);
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="icon">✨</div>
    <h1>歡迎光臨</h1>
    <p>很高興見到你！探索精彩內容，開啟一段美好的旅程。</p>
    <a href="#" class="btn">立即開始</a>
  </main>

</body>
</html>
